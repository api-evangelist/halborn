aid: halborn
name: Halborn
description: >-
  Halborn is a blockchain and digital-asset cybersecurity firm that sells professional security
  services rather than a developer product. Its assurance practice covers smart contract
  assessments, Layer 1 protocol reviews, code security audits, web application and cloud
  infrastructure penetration testing, red team exercises, and custody and key management
  assessments; its advisory practice covers AI security, blockchain architecture, compliance
  readiness, risk assessment, technical due diligence and technical training for banks, exchanges,
  custodians, tokenization platforms, stablecoin issuers, DeFi protocols, central banks and
  blockchain infrastructure providers. Halborn publishes its engagement results as a public audit
  repository, discloses zero-day findings under its own CVE assignment scope as a CVE Numbering
  Authority, and maintains BVSS, the Blockchain Vulnerability Scoring System. As of August 2026 it
  publishes no public API, no developer portal and no machine-readable contract; its Halborn ONE
  client platform at one.halborn.com is an invitation-only customer portal.
